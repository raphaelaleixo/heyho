<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Screenshotted by scripts/render-og.sh into assets/og.png at 1200×630.
     Just the wordmark and the line under it — a link preview is seen at
     thumbnail size, so the sheets themselves were unreadable there anyway. */
  body {
    margin: 0; width: 1200px; height: 630px; overflow: hidden;
    /* Paper ground, like the hero — it's what makes the wordmark's black
       contour visible instead of merging into the background. */
    background: #f7f4e9; color: #141414;
    font-family: 'Jua', sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 5.5rem;
    position: relative;
  }
  .checker {
    position: absolute; top: -80px; right: -80px; width: 432px; height: 432px;
    background: repeating-conic-gradient(#141414 0 25%, #f7f4e9 0 50%) 0 0 / 54px 54px;
    transform: rotate(12deg);
  }
  .mark { width: 700px; display: block; position: relative; }
  p {
    margin: 44px 0 0; max-width: 26ch; font-size: 34px; line-height: 1.4;
    position: relative;
  }
</style>
</head>
<body>
  <div class="checker"></div>
  <img class="mark" src="logo.svg" alt="">
  <p>A free print-and-go scavenger hunt for kids at a music festival.</p>
</body>
</html>
